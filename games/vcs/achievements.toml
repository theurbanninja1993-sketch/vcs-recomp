# Grand Theft Auto: Vice City Stories - the port's own achievement set.
#
# Why this is ours and not RetroAchievements: docs/vcs-handoff.md, open work item
# 16. RA excludes recompilations from standalone sets, so this is a local set in
# *their* condition format, which keeps it portable if that rule ever changes.
#
# Nothing here is Rockstar's: the titles and descriptions are ours, the addresses
# are facts about the game, and the file ships with the port.
#
# The shape follows the official trilogy sets - The Definitive Edition's, 29 to 35
# achievements each - which is what makes a set feel like the game's own: broad
# rather than deep, one to three per system, the whole of a collectible set in a
# single achievement, the name a joke or a quote and the description the
# instruction. The full survey and the reasoning are in the handoff notes.
#
# ---------------------------------------------------------------------------
# Format
#
#   [set]            name = "..."   version = 1
#   [achievement]    id, title, description, category, points, trigger
#
# `trigger` is a RetroAchievements condition string, evaluated by rcheevos against
# the guest's memory once per game frame:
#
#   0xH1234        one byte at 0x1234          0x1234     16 bits
#   0xX1234        32 bits                     0xW1234    24 bits
#   0xf1234        a float                     0xM1234    bit 0 (..0xT = bit 7)
#   ==  !=  <  <=  >  >=                       and, or, not
#   0xH1234=5.10.  five hits of this condition (client-side counting)
#
# An achievement with no `trigger` is listed but never unlocks - that is how the
# set keeps its shape while an address is still being hunted.
#
# ---------------------------------------------------------------------------
# Authoring the addresses
#
# Every trigger below needs an address, and the addresses are found by playing:
#
#   1. F9 writes a RAM dump next to the port (ram_<frame>.bin, 32 MB).
#   2. Do the thing the achievement is for, and take another dump.
#   3. Diff the two and look for the counter that moved by the right amount.
#   4. Confirm it live in Settings > Achievements > Address watcher: type the
#      address in, do the thing again, watch the number.
#
# Prefer the game's own counters over rcheevos' hit counting: a counter survives
# a reload and cannot be farmed by pausing, and "balloons burst = 99" is one read
# rather than ninety-nine frames of bookkeeping. Use hit counting only for things
# the game does not count itself.
#
# The story milestones are probably one progression counter rather than six flags
# - if the game keeps "missions passed" as a number, the six conditions become
# `>= n` on that one address. Worth checking first: it would be six conditions for
# the price of one.

[set]
name = "Grand Theft Auto: Vice City Stories"
version = 1

# ---------------------------------------------------------------- story (6)
# One per act, first and last mission of each chapter, the way the official sets
# name theirs after the mission.

[achievement]
