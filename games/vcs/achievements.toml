# ------------------------------------------------- hidden mission challenges (4)
# The four slots the official sets fill with a special way through one mission,
# always hidden. Held back deliberately: they are chosen against the missions, and
# the owner is playing the game through first. Add them here as ids 7-10 once the
# missions are picked - the shape to copy is Vice City DE's "Iron-y": kill the
# property developer with a Golf Club during "Four Iron".

