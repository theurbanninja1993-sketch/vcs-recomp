# Builder / launcher manifest for one game (see docs/vcs-handoff.md).
[game]
id = "SLUS_215.90"
name = "Grand Theft Auto: Vice City Stories"
region = "NTSC-U"
# XXH3-128 of the boot ELF on the disc (ps2x_iso hash <image>).
boot_file = "SLUS_215.90"
boot_hash_xxh3_128 = "7f69b961cc427e3dcfd6582e25362be8"

[recompiler]
# The builder writes a copy with absolute paths: [general] input = the
# extracted boot ELF, ghidra_output = function_map, output = a work folder.
config = "config/vcs_clean.toml"
function_map = "config/vcs_clean.csv"

[runtime]
# Name passed to PS2_REGISTER_GAME_OVERRIDE (ps2xRuntime/src/lib/game_overrides.cpp).
override = "GTA Vice City Stories (SLUS_215.90)"

[vu1]
# The microcode's place in the boot ELF (offsets only). With it every VU
# program is compiled from the player's own disc during the build, and the
# learn passes below are not run.
layout = "config/vu_layout.txt"
# Automated PS2X_VU1_LEARN / PS2X_VU0_CAPTURE passes after the first build: the
# fast-boot script, the opening cutscene, then taking Sgt. Martinez's bike and
# riding it. Every VU program the run reaches is compiled; ones it never reaches
# stay interpreted (~10x slower), so the route matters. The intro alone (3200
# frames) found 15 programs and no VU0 ones, and that build ran the opening
# cutscene ~25% late with the audio desynced; this route finds 22 (8 of them
# VU0). Longer play sessions have shown 30.
learn_passes = 2
learn_pad_script = "1000:cross:10;1200:cross:10;1400:cross:10;1600:cross:10;1800:cross:10;2000:cross:10;2200:cross:10;2700:triangle:20;3000:sup:60;3100:cross:2500;3300:sleft:40;3600:sright:60;4000:sleft:80;4500:sright:40;5000:sleft:60;5600:sright:80;6200:sleft:40"
learn_frames = 7000
